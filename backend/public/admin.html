
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <nav class="navbar">
        <h2>Vote<span>Live</span></h2>
        <a href="voter.html">Voter Page</a>
    </nav>

    <main class="main-container">
        <section class="welcome">
            <p class="eyebrow">ADMINISTRATION</p>
            <h1>Voting Dashboard</h1>
            <p>Monitor election results in real time.</p>
            <p id="connection" class="connection-status">Connecting...</p>
        </section>

        <section class="statistics">
            <div class="stat-card">
                <p>Total Votes</p>
                <h2 id="totalVotes">0</h2>
            </div>

            <div class="stat-card">
                <p>Total Candidates</p>
                <h2 id="totalCandidates">0</h2>
            </div>

        </section>

        <section class="chart-panel">
            <div class="panel-heading">
                <div>
                    <p class="eyebrow">LIVE OVERVIEW</p>
                    <h2>Votes by Candidate</h2>
                </div>
                <label for="categoryFilter">Category
                    <select id="categoryFilter">
                        <option value="all">All categories</option>
                    </select>
                </label>
            </div>
            <div id="chartEmpty" class="empty-state" hidden>No votes yet</div>
            <div class="chart-wrap"><canvas id="votesChart" aria-label="Votes per candidate" role="img"></canvas></div>
        </section>

        <section class="results-panel">
            <div class="panel-heading">
                <div>
                    <p class="eyebrow">LIVE BREAKDOWN</p>
                    <h2>Live Voting Results</h2>
                </div>
            </div>
            <div id="candidateResults"></div>
        </section>

        <section class="add-candidate-panel">
            <p class="eyebrow">ELECTION SETUP</p>
            <h2>Add a Candidate</h2>
            <form id="addCandidateForm" novalidate>
                <label for="candidateName">Candidate Name</label>
                <input type="text" id="candidateName" placeholder="Enter candidate name" required>

                <label for="candidateCategory">Category</label>
                <select id="candidateCategory" required>
                    <option value="" disabled selected>Select the office they are running for</option>
                </select>

                <button type="submit" id="addCandidateButton">+ Add Candidate</button>
            </form>
            <p id="candidateMessage" role="status" aria-live="polite"></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
